# Single source of truth for paths and tunable constants.
# Change values here, never hardcode them in modules. Changing a value = announce in team chat.

seed: 42

paths:
  train_dir: dataset/train
  test_dir: dataset/test          # "student testing" partition
  eval_dir: dataset/test          # override with env PATHSNAP_EVAL_DIR on demo day
  processed_dir: data/processed
  artifacts_dir: artifacts
  results_dir: results

labels:
  max_dist_m: 50.0                # GPS point farther than this from aligned route arc -> unlabelled (-1)
  min_labelled_share: 0.5         # drop a trip from training/eval tables if fewer points can be labelled
                                  # (GPS systematically offset from the network, e.g. train 00000033/00000054)

candidates:
  k: 8                            # max candidate arcs per GPS point
  radius_m: 60.0                  # search radius around each GPS point

gaps:
  split_s: 60.0                   # time gap that splits a track into independent HMM segments

cv:
  n_splits: 5                     # GroupKFold over trip_id (80 training trips)

hmm:
  sigma_m: 10.0                   # emission noise std (if distance term used)
  beta_m: 5.0                     # transition: exp(-|route_dist - straight_dist| / beta)
  max_route_factor: 4.0           # prune transitions whose route distance > factor * straight + 50 m
  emission: classifier            # classifier | distance | product

metrics:
  continuity_max_hops: 3          # consecutive predicted arcs "connected" if reachable within N arc hops

features:                         # P2 (pathsnap/features.py)
  heading_window_pts: 3           # heading/speed from the displacement between points i-w and i+w
  neighbour_window_pts: 3         # nbr_dist_* use the arc distance of points i-w..i+w (excluding i)
  heading_full_speed_mps: 5.0     # heading_align = cos(diff) * min(speed / this, 1): fades out when ~stopped

training:                         # P2 (scripts/train_models.py, scripts/bayes_opt.py)
  max_train_rows:                 # random row subsample when fitting (models not listed use all rows)
    knn: 200000                   # KNN prediction cost grows with the number of stored training rows
  importance_rows: 20000          # student-test rows sampled for permutation importance (scripts/model_diagnostics.py)
  importance_repeats: 2           # shuffles per feature; the mean increase in log loss is reported

optuna:                           # P2 (scripts/bayes_opt.py) — Bayesian optimisation, TRAIN partition only
  n_trials: 50                    # WORK_PLAN: at least 50
  objective: log_loss             # mean GroupKFold CV log loss (minimise): probabilities feed the HMM
  sampler_startup_trials: 10      # random trials before TPE starts modelling the search space
  pruner_warmup_folds: 1          # MedianPruner: may stop a trial after this many folds if clearly worse
